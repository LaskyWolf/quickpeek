[package]
name = "quickpeek"
version = "0.2.0"
edition = "2024"
license = "GPL-3.0-or-later"

[workspace]
members = ["launcher"]

[profile.release]
lto = true
strip = true

[dependencies]
calamine = { version = "0.38.0", features = ["dates"] }
csv = "1.4.0"
cxx = "1.0.205"
cxx-qt = "0.10"
cxx-qt-lib = { version = "0.10", features = ["qt_full"] }
kamadak-exif = "0.6.2"
quick-xml = "0.42"
serde_json = "1"
zip = { version = "9", default-features = false, features = ["deflate"] }
syntect ={ version = "5", default-features = false, features = ["default-fancy"] }

[build-dependencies]
cxx-qt-build = "0.10"

[[bin]]
name = "quickpeek-window"
path = "rust/window.rs"
