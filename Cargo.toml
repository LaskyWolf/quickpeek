[package]
name = "quickpeek"
version = "0.2.0"
edition = "2024"
license = "GPL-3.0-or-later"

[workspace]
members = ["launcher"]

[profile.release]
lto = true
strip = true

[dependencies]
calamine = { version = "0.38.0", features = ["dates"] }
csv = "1.4.0"
lopdf = { version = "0.47.0", default-features = false }
cxx = "1.0.205"
cxx-qt = "0.10"
cxx-qt-lib = { version = "0.10", features = ["qt_full"] }
serde_json = "1"
syntect = { version = "5", default-features = false, features = ["default-fancy"] }

[build-dependencies]
cxx-qt-build = "0.10"

[[bin]]
name = "quickpeek-window"
path = "rust/window.rs"
