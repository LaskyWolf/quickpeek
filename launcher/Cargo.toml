# The `quickpeek` command: hands a file to the running window without loading Qt.
[package]
name = "quickpeek-launcher"
version = "1.0.1"
edition = "2024"
license = "GPL-3.0-or-later"

[[bin]]
name = "quickpeek"
path = "../rust/main.rs"

[[bin]]
name = "quickpeek-desktop"
path = "../rust/desktop_patch.rs"
